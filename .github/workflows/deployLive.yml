name: Deploy to Live

# Same pattern as promax-global's deployLive.yml, adapted for a server-rendered app:
# this site has API routes, Prisma and next-auth, so it can't be a static export.
# Instead we verify the build in CI, then SSH in and rebuild + reload PM2 on the VPS.
#
# Server layout: app in /home/trot-website/website, owned by the trot-website user,
# which also owns the PM2 daemon. nginx proxies trotsolutions.com -> 127.0.0.1:3000.

on:
  push:
    branches:
      - latest
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false # never kill a deploy halfway through a server build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"

      - name: Build (verify before touching the server)
        run: npm run build
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"
          # Placeholder so src/lib/auth.ts doesn't throw at build time; the server uses its real .env.
          NEXTAUTH_SECRET: "ci-build-placeholder"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            sudo -u trot-website -H bash -lc '
              set -e
              cd ~/website
              git fetch origin latest
              # Untracked files (.env, new uploads) are left alone by checkout -f.
              git checkout -f -B latest origin/latest
              npm ci
              npx prisma generate
              npm run build
              pm2 reload trot-website --update-env
              pm2 save
            '
