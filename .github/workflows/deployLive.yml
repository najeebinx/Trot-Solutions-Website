name: Deploy to Live

# Same pattern as promax-global's deployLive.yml, adapted for a server-rendered app:
# this site has API routes, Prisma and next-auth, so it can't be a static export.
# Instead we verify the build in CI, then SSH in and rebuild + reload PM2 on the VPS.

on:
  push:
    branches:
      - latest
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"

      - name: Build (verify before touching the server)
        run: npm run build
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/trot-solutions
            git fetch origin latest
            git reset --hard origin/latest
            npm ci
            npx prisma generate
            npm run build
            pm2 reload trot-website --update-env || pm2 start ecosystem.config.js
            pm2 save
